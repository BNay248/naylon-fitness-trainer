<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions · Naylon Fitness Portal</title>
<link rel="icon" href="/static/NFP.jpg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container"></div>
<div id="toasts"></div>
<script src="/static/common.js"></script>
<script src="/static/session-ui.js"></script>
<script>
  let catalog = makeCatalog([]);
  let clients = [];

  async function logWorkout(session, supersets) {
    await api('POST', `/api/sessions/${session.id}/log`, { supersets, logged_at: new Date().toISOString() });
    toast('Session saved');
  }

  function openSessionIds() {
    return new Set([...document.querySelectorAll('details[data-session-id][open]')].map(node => node.dataset.sessionId));
  }

  async function renderSessions(main) {
    const reopen = openSessionIds();
    const [exercises, data] = await Promise.all([api('GET', '/api/exercises'), api('GET', '/api/sessions')]);
    catalog = makeCatalog(exercises);
    clients = data.clients;
    const onChanged = () => renderSessions(main).catch(err => toast(err.message, 'error'));
    const card = session => sessionCard(session, { catalog, onChanged, logWorkout });

    const createPanel = el('details', { class: 'card' },
      el('summary', {}, 'Create New Session'),
      el('p', { class: 'muted field' }, 'Build a session with supersets and repeated exercise rounds.'),
      sessionBuilder({
        catalog,
        saveLabel: 'Create Session',
        clients: ME.role === 'coach' ? clients : null,
        onSave: async body => {
          await api('POST', '/api/sessions', body);
          toast('Session created');
          await onChanged();
        },
      }),
    );

    mount(main,
      el('h1', {}, 'Training Sessions'),
      el('div', { class: 'info' }, 'Build your weekly workout flow with supersets and repeat-based exercise rounds.'),
      createPanel,
      el('h2', {}, 'Your Sessions'),
      data.mine.length ? data.mine.map(card) : el('p', { class: 'muted' }, 'No sessions yet. Create your first one above.'),
      ME.role === 'coach' && [
        el('h2', {}, 'Client Sessions'),
        clients.length ? clients.map(client => el('details', { class: 'card', id: `client-${client.username}`, dataset: { sessionId: `client-${client.username}` } },
          el('summary', {}, el('span', {}, `${client.name} (${client.username})`), el('span', { class: 'tag' }, `${client.sessions.length} session(s)`)),
          client.sessions.length ? client.sessions.map(card) : el('p', { class: 'muted' }, 'No sessions assigned to this client yet.'),
        )) : el('p', { class: 'muted' }, 'No clients yet.'),
      ],
    );

    // Deep link from the Clients page: /#client-<username>
    if (location.hash.startsWith('#client-')) reopen.add(location.hash.slice(1));
    reopen.forEach(id => {
      const node = main.querySelector(`details[data-session-id="${CSS.escape(id)}"]`);
      if (node) node.open = true;
    });
  }

  boot('sessions', main => renderSessions(main).catch(err => mount(main, el('div', { class: 'error' }, err.message))));
</script>
</body>
</html>
