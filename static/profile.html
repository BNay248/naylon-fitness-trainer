<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · Naylon Fitness Portal</title>
<link rel="icon" href="/static/NFP.jpg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container"></div>
<div id="toasts"></div>
<script src="/static/common.js"></script>
<script src="/static/library-ui.js"></script>
<script>
  // Quick ways to fill the equipment checklist; they only tick boxes (by equipment name).
  const EQUIPMENT_PRESETS = {
    'Bodyweight at home': ['Pull-Up Bar', 'Wall', 'Resistance Band'],
    'Dumbbells at home': ['Dumbbell', 'Adjustable Bench', 'Resistance Band', 'Pull-Up Bar', 'Wall'],
    'Full gym': null, // everything except FULL_GYM_EXCLUDES
  };
  // Outdoor, strongman and specialty kit a typical gym doesn't have; people tick these themselves.
  const FULL_GYM_EXCLUDES = ['Swimming Pool', 'Bicycle', 'Log', 'Atlas Stone', 'Yoke', 'Tire', 'Sledgehammer', 'Neck Harness',
    'Hangboard', 'Climbing Rope', 'VersaClimber'];

  function equipmentSection(library) {
    const picker = equipmentPicker(library, ME.equipment_ids, 'My equipment');
    const idsNamed = names => library.equipment
      .filter(item => names ? names.includes(item.name) : !FULL_GYM_EXCLUDES.includes(item.name)).map(item => item.id);
    return el('div', {},
      el('p', { class: 'muted field' }, 'Workout suggestions only use equipment you have. Leave it empty to see everything.'),
      el('div', { class: 'chips field' }, Object.entries(EQUIPMENT_PRESETS).map(([label, names]) =>
        el('span', { class: 'chip', onclick: () => picker.set(idsNamed(names)) }, label)),
        el('span', { class: 'chip', onclick: () => picker.reset() }, 'Clear')),
      picker.node,
      el('div', { class: 'buttons' }, el('button', { class: 'primary', onclick: e => withBusy(e.currentTarget, async () => {
        const equipment_ids = picker.read();
        await api('PUT', '/api/me/equipment', { equipment_ids });
        ME.equipment_ids = equipment_ids;
        toast('Equipment saved');
      }) }, 'Save Equipment')));
  }

  async function render(main) {
    const library = await api('GET', '/api/library');
    const current = el('input', { type: 'password', autocomplete: 'current-password' });
    const next = el('input', { type: 'password', autocomplete: 'new-password' });
    const confirm = el('input', { type: 'password', autocomplete: 'new-password' });
    const submit = el('button', { type: 'submit', class: 'primary' }, 'Update Password');

    const form = el('form', { class: 'card', onsubmit: e => {
      e.preventDefault();
      if (next.value !== confirm.value) return toast("New passwords don't match", 'error');
      if (next.value.length < 6) return toast('New password must be at least 6 characters', 'error');
      withBusy(submit, async () => {
        await api('POST', '/api/password', { current_password: current.value, new_password: next.value });
        form.reset();
        toast('Password updated successfully!');
      });
    } },
      el('div', { class: 'field' }, el('label', {}, 'Current Password'), current),
      el('div', { class: 'field' }, el('label', {}, 'New Password'), next),
      el('div', { class: 'field' }, el('label', {}, 'Confirm New Password'), confirm),
      submit,
      el('p', { class: 'muted', style: 'margin-top:10px' }, 'Minimum 6 characters.'),
    );

    mount(main,
      el('h1', {}, 'Profile'),
      el('div', { class: 'card' },
        el('div', { class: 'list-row' }, el('span', { class: 'grow muted' }, 'Name'), ME.name),
        el('div', { class: 'list-row' }, el('span', { class: 'grow muted' }, 'Username'), ME.username),
        el('div', { class: 'list-row' }, el('span', { class: 'grow muted' }, 'Email'), ME.email),
        el('div', { class: 'list-row' }, el('span', { class: 'grow muted' }, 'Role'), ME.role === 'coach' ? 'Coach' : 'Client'),
      ),
      ME.role !== 'coach' && el('p', { class: 'muted field' }, COACH_CONTACT),
      el('h2', {}, 'Training Equipment'),
      equipmentSection(library),
      el('h2', {}, 'Change Password'),
      form,
    );
  }

  boot('profile', main => render(main).catch(err => mount(main, el('div', { class: 'error' }, err.message))));
</script>
</body>
</html>
