<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muscles · Naylon Fitness Portal</title>
<link rel="icon" href="/static/NFP.jpg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container"></div>
<div id="toasts"></div>
<script src="/static/common.js"></script>
<script>
  // Form fields for a muscle group, or for a muscle when `groups` is given; returns {node, read(), reset()}.
  function namedForm(item = {}, groups = null) {
    const name = el('input', { type: 'text', value: item.name || '' });
    const description = el('textarea', {}, item.description || '');
    const group = groups && el('select', {},
      el('option', { value: '' }, 'Choose a group…'),
      groups.map(g => el('option', { value: g.id, selected: g.id === item.group_id }, g.name)));
    return {
      node: el('div', {},
        el('div', { class: 'field' }, el('label', {}, 'Name*'), name),
        group && el('div', { class: 'field' }, el('label', {}, 'Muscle Group*'), group),
        el('div', { class: 'field' }, el('label', {}, 'Description (optional)'), description),
      ),
      read() {
        const body = { name: name.value.trim(), description: description.value.trim() };
        if (group) body.group_id = group.value;
        if (!body.name || (group && !body.group_id)) throw new Error('Please fill in all required fields');
        return body;
      },
      reset() {
        name.value = description.value = '';
        if (group) group.value = '';
      },
    };
  }

  function formAction(button, form, request) {
    return withBusy(button, async () => {
      let body;
      try { body = form.read(); } catch (err) { return toast(err.message, 'error'); }
      await request(body);
    });
  }

  // Save + two-step delete buttons for an existing muscle or group.
  function editActions(form, { path, label, refresh, warning }) {
    let confirming = false;
    const actions = el('div', {});
    const draw = () => mount(actions, confirming
      ? el('div', { class: 'confirm' }, `Delete "${label}"? ${warning}`,
        el('div', { class: 'buttons' },
          el('button', { class: 'danger', onclick: e => withBusy(e.currentTarget, async () => {
            await api('DELETE', path);
            toast(`"${label}" deleted`);
            await refresh();
          }) }, 'Yes, delete'),
          el('button', { onclick: () => { confirming = false; draw(); } }, 'Cancel')))
      : el('div', { class: 'buttons' },
        el('button', { class: 'primary', onclick: e => formAction(e.currentTarget, form, async body => {
          await api('PUT', path, body);
          toast('Saved');
          await refresh();
        }) }, 'Save'),
        el('button', { class: 'danger', onclick: () => { confirming = true; draw(); } }, 'Delete')));
    draw();
    return actions;
  }

  async function render(main) {
    const { groups, muscles } = await api('GET', '/api/muscles');
    const open = new Set([...main.querySelectorAll('details[open][data-key]')].map(node => node.dataset.key));
    const refresh = () => render(main);
    const membersOf = group => muscles.filter(muscle => muscle.group_id === group.id);

    const addGroup = namedForm();
    const addMuscle = namedForm({}, groups);
    const list = el('div', {});
    const filter = el('input', { type: 'search', placeholder: `Filter ${muscles.length} muscles…`, oninput: () => applyFilter() });

    function applyFilter() {
      const query = filter.value.trim().toLowerCase();
      list.querySelectorAll('details[data-group]').forEach(card => {
        // A matching group shows all its muscles; otherwise only the matching muscles show.
        const groupHit = !query || card.dataset.name.includes(query);
        let any = groupHit;
        card.querySelectorAll('details[data-muscle]').forEach(node => {
          const hit = groupHit || node.dataset.name.includes(query);
          node.classList.toggle('hidden', !hit);
          any = any || hit;
        });
        card.classList.toggle('hidden', !any);
        if (query && any) card.open = true;
      });
    }

    mount(main,
      el('h1', {}, 'Manage Muscles'),
      el('div', { class: 'info' }, 'Every muscle belongs to a group. When a muscle is added to an exercise, its group is added too.'),
      el('details', { class: 'card', dataset: { key: 'add-muscle' }, open: open.has('add-muscle') },
        el('summary', {}, 'Add Muscle'),
        addMuscle.node,
        el('div', { class: 'buttons' }, el('button', { class: 'primary', onclick: e => formAction(e.currentTarget, addMuscle, async body => {
          await api('POST', '/api/muscles', body);
          toast(`"${body.name}" added`);
          await refresh();
        }) }, 'Add Muscle'))),
      el('details', { class: 'card', dataset: { key: 'add-group' }, open: open.has('add-group') },
        el('summary', {}, 'Add Muscle Group'),
        addGroup.node,
        el('div', { class: 'buttons' }, el('button', { class: 'primary', onclick: e => formAction(e.currentTarget, addGroup, async body => {
          await api('POST', '/api/muscle-groups', body);
          toast(`"${body.name}" added`);
          await refresh();
        }) }, 'Add Group'))),
      el('h2', {}, `Muscle Groups (${groups.length})`),
      el('div', { class: 'field' }, filter),
      list,
    );

    mount(list, groups.length ? groups.map(group => {
      const members = membersOf(group);
      const groupForm = namedForm(group);
      return el('details', { class: 'card', dataset: { key: `g-${group.id}`, group: group.id, name: group.name.toLowerCase() }, open: open.has(`g-${group.id}`) },
        el('summary', {}, el('span', {}, group.name), el('span', { class: 'tag' }, `${members.length} muscle${members.length === 1 ? '' : 's'}`)),
        group.description && el('p', { class: 'muted field' }, group.description),
        members.length ? members.map(muscle => {
          const form = namedForm(muscle, groups);
          return el('details', { class: 'card', dataset: { key: `m-${muscle.id}`, muscle: muscle.id, name: muscle.name.toLowerCase() }, open: open.has(`m-${muscle.id}`) },
            el('summary', {}, muscle.name),
            form.node,
            editActions(form, { path: `/api/muscles/${muscle.id}`, label: muscle.name, refresh, warning: 'It will be removed from every exercise that uses it.' }));
        }) : el('p', { class: 'muted field' }, 'No muscles in this group yet.'),
        el('details', { class: 'card', dataset: { key: `e-${group.id}` }, open: open.has(`e-${group.id}`) },
          el('summary', {}, 'Edit Group'),
          groupForm.node,
          editActions(groupForm, { path: `/api/muscle-groups/${group.id}`, label: group.name, refresh, warning: 'It will be removed from every exercise that uses it.' })),
      );
    }) : el('p', { class: 'muted' }, 'No muscle groups yet.'));
    applyFilter();
  }

  boot('muscles', main => render(main).catch(err => mount(main, el('div', { class: 'error' }, err.message))), { coachOnly: true });
</script>
</body>
</html>
